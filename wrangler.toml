name = "score-api"
main = "worker.js"
compatibility_date = "2024-01-01"

[placement]
mode = "smart"

# 自定义域名：api.mayichu.top → 本 Worker
# 前提：mayichu.top 已接入当前 Cloudflare 账号（NS 指向 Cloudflare）
routes = [
	{ pattern = "api.mayichu.top", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "my-score-db"
database_id = "95e14293-8140-4bd4-bd26-7d8f29f0a099" 

# Independent stores for learning, collections and behavior records.
[[d1_databases]]
binding = "DB_MAYIQIAN"
database_name = "pokemon-ma-yi-qian"
database_id = "21192478-4c2c-4f39-b4bb-8c31be5fac14"

[[d1_databases]]
binding = "DB_MAYICHU"
database_name = "pokemon-ma-yi-chu"
database_id = "89282476-093e-4360-a2ea-d8c6e0aec9df"
